<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Appuntamenti</title>
    <link rel="stylesheet" href={{ url_for('static', filename='styles/style.css') }}>
</head>
<body>
    <div class="container_2">
        <div class="secondo_titolo">
            <p>Se non ti sei registrato, oggi lo puoi fare</p>
            <h2>Registrati</h2>
        </div>
        <div class="bordi-form">
            <form action="/process_form" method="POST">
                <label for="nome">Nome:</label>
                <input type="text" name="nome" size="40"/>
            
                <label for="cognome">Cognome:</label>
                <input type="text" name="cognome" id="cognome" size="30" />
    
                <label for="number">Numero:</label>
                <input type="text" name="number" id="number" size="30" />
    
                <label for="text">Via:</label>
                <input type="text" name="Via" id="Via" size="30" />
        
                <label for="password">Passaword:</label>
                <input type="password" name="password" size="40"/>
                <button type="submit">Invia</button>
            </form>
        </div>
    </div>
    <div class="container">
        <h1>Calendario Appuntamenti</h1>
        <div>
            <p>Prenota il tuo appuntamento</p>
            <p>Giorni disponibili</p>
        </div>
        <section>
            <div class="calendar">
                <div class="day day-header">Lun</div>
                <div class="day day-header">Mar</div>
                <div class="day day-header">Mer</div>
                <div class="day day-header">Gio</div>
                <div class="day day-header">Ven</div>
                <div class="day day-header">Sab</div>
                <div class="day day-header">Dom</div>
                <div class="day">1</div>
                <div class="day">2</div>
                <div class="day">3</div>
                <div class="day">4</div>
                <div class="day">5</div>
                <div class="day">6</div>
                <div class="day">7</div>
                <div class="day">8</div>
                <div class="day">9</div>
                <div class="day">10</div>
                <div class="day">11</div>
                <div class="day">12</div>
                <div class="day">13</div>
                <div class="day">14</div>
                <div class="day">15</div>
                <div class="day">16</div>
                <div class="day">17</div>
                <div class="day">18</div>
                <div class="day">19</div>
                <div class="day">20</div>
                <div class="day">21</div>
                <div class="day">22</div>
                <div class="day">23</div>
                <div class="day">24</div>
                <div class="day">25</div>
                <div class="day">26</div>
                <div class="day">27</div>
                <div class="day">28</div>
                <div class="day">29</div>
                <div class="day">30</div>
                <div class="day">31</div>
            </div>
            <form action="">
                <h3>Imformativa per la privacy </h3>
                <p>
                <input type="checkbox" id="html" value="HTML">
                <label for="html">Prova</label>
                </p>
            </form>
        </div>
    </section>
</body>
</html>
